
<!DOCTYPE html>
<html lang="de-CH">
<!--
  Golf Together
  -------------
  Web-App zur Anzeige von Golfevents und zur Verwaltung von Anmeldungen.
  Die Daten werden in Firebase Realtime Database gespeichert.
  Veröffentlichung über GitHub Pages.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>golf together</title>
<style>
/* ===== Grundlayout und Farben ===== */
body{margin:0;background:#f5f6ef;color:#203d32;font-family:Arial,sans-serif}
header{background:#173f35;color:white;padding:22px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;color:#d9ed9b;font-size:13px}
button{cursor:pointer;border:0;border-radius:8px;background:#173f35;color:white;padding:12px 16px;font-weight:bold}
button:disabled{opacity:.6;cursor:not-allowed}
header button{background:#d9ed9b;color:#173f35;padding:3px 5px;font-size:13px;line-height:1;border-radius:5px;min-width:0}
main{max-width:760px;margin:35px auto;padding:0 16px}
h2{margin-top:0}
.card,.panel{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 16px #00000010;margin-bottom:18px}
  /* ===== Schriftgrösse für Datum & Event ===== */
.event-heading{font-size:18px;font-weight:bold;margin:0 0 12px}
.meta{font-size:9px;color:#6a806d}
/* Teilnehmer-Kürzel in einem kompakten, responsiven Raster */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;margin:8px 0 15px}
.participant-label{font-size:13px;color:#6a806d;margin:10px 0 4px}
.person{display:flex;justify-content:center;align-items:center;min-width:0;padding:6px 4px;border:0;border-radius:7px;font-weight:bold;font-size:12px;cursor:pointer;background:#e7efdc;color:#203d32}
.person:focus-visible{outline:2px solid #173f35;outline-offset:2px}
.signup-toggle{display:inline-block;background:transparent;color:#203d32;border:0;padding:0;margin:0;font-size:12px;font-weight:normal;text-align:left;cursor:pointer}
.signup-toggle:hover{text-decoration:underline}
.no-signups{grid-column:1/-1;font-size:12px;color:#6a806d;white-space:nowrap;padding:2px 0}
.person-details{grid-column:1/-1;background:#f5f6ef;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:normal;display:flex;align-items:center;justify-content:space-between;gap:8px}
.person-details .person-name{overflow-wrap:anywhere}
.person-details button{padding:5px 8px;font-size:11px;flex-shrink:0}
label{display:block;font-size:13px;margin:12px 0 5px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5ca;border-radius:7px;font-size:16px}
form button{margin-top:14px}
.wide{width:100%}
.secondary{background:#e7efdc;color:#173f35}
.danger{background:#8d3328}
[hidden]{display:none!important}
.note{font-size:13px;line-height:1.5;color:#68756d}
footer{text-align:center;padding:25px;color:#6a806d;font-size:13px}
/* ===== Anmeldedialog ===== */
dialog{width:calc(100% - 32px);max-width:360px;border:0;border-radius:12px;padding:16px;box-shadow:0 8px 35px #0003;box-sizing:border-box}
dialog::backdrop{background:#0006}
#signup-dialog h2{font-size:19px;margin:0 0 5px}
#signup-dialog #signup-date{margin:0 0 8px;font-size:10px}
#signup-dialog label{margin:7px 0 3px;font-size:12px}
#signup-dialog input{padding:8px 10px;font-size:15px}
#signup-dialog button{padding:9px 12px;font-size:13px}
#signup-dialog form button{margin-top:9px}
#signup-dialog #signup-message{margin:7px 0 0;font-size:12px}
</style>
</head>
<body>
<!-- ===== Kopfzeile ===== -->
<header>
  <div><h1>golf together</h1><p>gemeinsam mehr spass</p></div>
  <button id="admin-open" type="button" aria-label="Administration öffnen" title="Administration öffnen">⚙</button>
</header>

<!-- ===== Hauptbereich: Events und Administration ===== -->
<main>
  <div id="events">Events werden geladen …</div>
<p id="status" class="note" role="status"></p>

  <!-- Nur für Administratoren: Login und Eventverwaltung -->
  <section id="admin" class="panel" hidden>
    <button id="admin-close" type="button" class="secondary">Schliessen</button>
    <h2>Eventverwaltung</h2>

    <form id="login">
      <p class="note">Admin-Anmeldung</p>
      <label for="email">E-Mail-Adresse</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="wide" type="submit">Anmelden</button>
      <p id="login-message" class="note"></p>
    </form>

    <div id="admin-tools" hidden>
      <p>Du bist als Administrator angemeldet.</p>
      <button id="logout" type="button" class="secondary">Abmelden</button>

      <h3>Neues Event erstellen</h3>
      <form id="event-form">
        <label for="event-title">Eventname</label>
        <input id="event-title" required placeholder="Golfclub Waldkirch">
        <label for="event-date">Datum</label>
        <input id="event-date" type="date" required>
        <label for="event-location">Ort</label>
        <input id="event-location" required placeholder="Waldkirch">
        <label for="event-description">Beschreibung</label>
        <input id="event-description" placeholder="Optional">
        <button class="wide" type="submit">Event speichern</button>
        <p id="event-message" class="note"></p>
      </form>

      <h3>Events verwalten</h3>
      <div id="admin-events"></div>
    </div>
  </section>
</main>

<footer>golf together · Schön, dass du dabei bist.</footer>

<!-- Dialog für die Anmeldung mit Vorname und Nachname -->
<dialog id="signup-dialog">
  <form id="signup-form">
    <h2 id="signup-title">Anmeldung</h2>
    <p id="signup-date" class="note"></p>
    <label for="first">Vorname</label>
    <input id="first" maxlength="50" autocomplete="given-name" required>
    <label for="last">Nachname</label>
    <input id="last" maxlength="50" autocomplete="family-name" required>
    <button class="wide" type="submit">Anmeldung bestätigen</button>
    <button type="button" id="signup-close" class="secondary wide">Abbrechen</button>
    <p id="signup-message" class="note"></p>
  </form>
</dialog>

<script type="module">
/*
 * Firebase und App-Logik
 * - Anonyme Anmeldung für Teilnehmende
 * - E-Mail/Passwort für die Administration
 * - Live-Aktualisierung von Events und Anmeldungen
 * - Teilnehmerkürzel zeigen auf Klick kurz den vollständigen Namen
 * - Anmeldungen können geräteübergreifend entfernt werden
 */
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  onValue,
  push,
  set,
  remove,
  get
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

// Verbindungseinstellungen für das Firebase-Projekt.
const firebaseConfig = {
  apiKey: "AIzaSyCrqW1W42rT1DumrbdLUJ8FvneFjwNdKMs",
  authDomain: "golf-together-4a1b7.firebaseapp.com",
  databaseURL: "https://golf-together-4a1b7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "golf-together-4a1b7",
  storageBucket: "golf-together-4a1b7.firebasestorage.app",
  messagingSenderId: "444425305425",
  appId: "1:444425305425:web:111aec354d495836bee770"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let user = null;
let isAdmin = false;
let events = {};
let signups = {};
let selectedEvent = null;
let authReady = false;

const say = (id, message) => {
  const el = $(id);
  if (el) el.textContent = message;
};

const clean = value => String(value ?? "");

const initials = (first, last) =>
  Array.from(first.trim())[0].toLocaleUpperCase("de-CH") +
  Array.from(first.trim()).slice(1, 2).join("").toLocaleLowerCase("de-CH") +
  Array.from(last.trim())[0].toLocaleUpperCase("de-CH") +
  Array.from(last.trim()).slice(1, 2).join("").toLocaleLowerCase("de-CH");

// Datumsformat in der Übersicht: TT.MM.JJJJ
function dateLabel(date) {
  if (!date) return "";
  return new Intl.DateTimeFormat("de-CH", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(new Date(date + "T12:00:00"));
}

function node(tag, text, className) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  if (className) el.className = className;
  return el;
}

// Erstellt die Eventkarten und Teilnehmerlisten aus den aktuellen Daten.
function render() {
  // Übersicht bei jeder Änderung aktualisieren

  const root = $("events");
  root.replaceChildren();

  const rows = Object.entries(events).sort((a, b) =>
    clean(a[1].date).localeCompare(clean(b[1].date))
  );

  if (!rows.length) {
    root.append(node("p", "Noch keine Events erfasst."));
    return;
  }

  for (const [id, event] of rows) {
    const card = node("article", undefined, "card");

    card.append(node(
      "p",
      dateLabel(event.date) + " " + clean(event.location),
      "event-heading"
    ));

    if (event.description) {
      card.append(node("p", event.description));
    }

    const entries = Object.entries(signups[id] || {});

    // Teilnehmerliste bleibt zunächst verborgen und wird über "Angemeldet" geöffnet.
    const count = node("button", `Angemeldet: ${entries.length} ▾`, "signup-toggle");
    count.type = "button";
    count.setAttribute("aria-expanded", "false");
    count.style.fontSize = "12px";
    card.append(count);

    const participantLabel = node(
      "p",
      "Teilnehmer (Klick auf Kürzel zeigt den ganzen Namen)",
      "participant-label"
    );
    participantLabel.hidden = true;
    card.append(participantLabel);

    const people = node("div", undefined, "people");
    people.hidden = true;
    people.setAttribute("aria-label", "Teilnehmer; Kürzel anklicken, um den Namen anzuzeigen");

    count.addEventListener("click", () => {
      const isOpen = !people.hidden;
      people.hidden = isOpen;
      participantLabel.hidden = isOpen;
      count.setAttribute("aria-expanded", String(!isOpen));
      count.textContent = `Angemeldet: ${entries.length} ${isOpen ? "▾" : "▴"}`;
    });

    if (!entries.length) {
      people.append(node("span", "Noch keine Anmeldungen", "no-signups"));
    }

    for (const [uid, person] of entries) {
      // Das Kürzel bleibt kompakt; Name und Abmeldefunktion erscheinen erst nach Klick.
      const chip = node("button", person.initials || "??", "person");
      chip.type = "button";
      chip.title = "Klicken, um den vollständigen Namen und die Abmeldefunktion anzuzeigen";
      chip.setAttribute("aria-expanded", "false");

      const details = node("div", undefined, "person-details");
      details.hidden = true;
      const name = person.fullName || person.initials || "Unbekannte Person";
      details.append(node("span", name, "person-name"));

      if (user) {
        const cancel = node("button", "Abmelden", "danger");
        cancel.type = "button";
        cancel.setAttribute("aria-label", `Anmeldung von ${name} entfernen`);

        cancel.addEventListener("click", async event => {
          event.stopPropagation();
          if (!confirm(`Möchtest du die Anmeldung von ${name} wirklich entfernen?`)) return;

          try {
            await remove(ref(db, `signups/${id}/${uid}`));
            say("status", `Die Anmeldung von ${name} wurde entfernt.`);
          } catch (error) {
            console.error("Abmelden fehlgeschlagen:", error);
            say("status", `Abmelden fehlgeschlagen: ${error.code || error.message}`);
          }
        });

        details.append(cancel);
      }

      chip.addEventListener("click", () => {
        const isOpen = !details.hidden;
        details.hidden = isOpen;
        chip.setAttribute("aria-expanded", String(!isOpen));
      });

      people.append(chip, details);
    }

    card.append(people);

    const own = user && signups[id]?.[user.uid];

    const button = node(
      "button",
      own ? "Du bist angemeldet ✓" : "Interesse/Anmeldung",
      "wide"
    );

    button.type = "button";
    button.disabled = Boolean(own) || !authReady;

    if (!own) {
      button.addEventListener("click", () => {
        selectedEvent = id;
        $("signup-title").textContent = "Interesse/Anmeldung";
        $("signup-date").textContent =
          dateLabel(event.date) + " " + event.location;
        $("signup-form").reset();
        say("signup-message", "");
        $("signup-dialog").showModal();
      });
    }

    card.append(button);
    root.append(card);
  }
}

$("signup-close").addEventListener("click", () => {
  $("signup-dialog").close();
});

$("signup-form").addEventListener("submit", async e => {
  e.preventDefault();

  if (!user || !selectedEvent) {
    say("signup-message", "Bitte warte, bis die Anmeldung bereit ist, und versuche es erneut.");
    return;
  }

  const first = $("first").value.trim();
  const last = $("last").value.trim();

  if (!first || !last) {
    say("signup-message", "Bitte Vorname und Nachname eingeben.");
    return;
  }

  const signupRef = ref(db, `signups/${selectedEvent}/${user.uid}`);

  const submitButton = $("signup-form").querySelector(
    'button[type="submit"], input[type="submit"]'
  );

  if (submitButton) submitButton.disabled = true;

  try {
    const existing = await get(signupRef);

    if (existing.exists()) {
      say("signup-message", "Du bist bereits angemeldet.");
      return;
    }

   await set(signupRef, {
      initials: initials(first, last),
      fullName: `${first} ${last}`,
      createdAt: Date.now()
    });

    $("signup-dialog").close();
    say("status", "Deine Anmeldung wurde gespeichert.");

  } catch (error) {
    console.error("Fehler bei der Anmeldung:", error);
    say(
      "signup-message",
      `Speichern fehlgeschlagen: ${error.code || error.message}`
    );
  } finally {
    if (submitButton) submitButton.disabled = false;
  }
});

$("admin-open").addEventListener("click", () => {
  // In der Administration nur die Verwaltungsmaske zeigen, nicht die öffentliche Eventübersicht.
  $("events").hidden = true;
  $("admin").hidden = false;
  $("admin").scrollIntoView({ behavior: "smooth" });
});

$("admin-close").addEventListener("click", () => {
  // Beim Schliessen der Administration die Eventübersicht wieder anzeigen.
  $("admin").hidden = true;
  $("events").hidden = false;
});

$("login").addEventListener("submit", async e => {
  e.preventDefault();

  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
    say("login-message", "");
  } catch (error) {
    console.error("Admin-Anmeldung fehlgeschlagen:", error);
    say("login-message", `Anmeldung fehlgeschlagen: ${error.code || error.message}`);
  }
});

$("logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
    await signInAnonymously(auth);
  } catch (error) {
    console.error("Abmelden fehlgeschlagen:", error);
    say("status", "Abmelden fehlgeschlagen. Bitte Verbindung prüfen.");
  }
});

function renderAdminEvents() {
  const root = $("admin-events");
  root.replaceChildren();

  for (const [id, event] of Object.entries(events)) {
    const row = node("div", undefined, "card");
    row.append(node("strong", event.title));
    row.append(node("p", dateLabel(event.date) + " · " + event.location));

    const del = node("button", "Event löschen", "danger");
    del.type = "button";

    del.addEventListener("click", async () => {
      if (!confirm("Event und alle Anmeldungen löschen?")) return;

      try {
        await remove(ref(db, `events/${id}`));
        await remove(ref(db, `signups/${id}`));
        say("status", "Event und Anmeldungen wurden gelöscht.");
      } catch (error) {
        console.error("Event löschen fehlgeschlagen:", error);
        say("status", `Löschen fehlgeschlagen: ${error.code || error.message}`);
      }
    });

    row.append(del);
    root.append(row);
  }
}

$("event-form").addEventListener("submit", async e => {
  e.preventDefault();

  if (!isAdmin) {
    say("event-message", "Du hast keine Administratorrechte.");
    return;
  }

  const event = {
    title: $("event-title").value.trim(),
    date: $("event-date").value,
    location: $("event-location").value.trim(),
    description: $("event-description").value.trim()
  };

  try {
    await set(push(ref(db, "events")), event);
    e.target.reset();
    say("event-message", "Event wurde gespeichert.");
  } catch (error) {
    console.error("Event speichern fehlgeschlagen:", error);
    say("event-message", `Speichern fehlgeschlagen: ${error.code || error.message}`);
  }
});

onAuthStateChanged(auth, async current => {
  user = current;

  if (!user) {
    authReady = false;
    render();
    return;
  }

  try {
    const adminSnap = await get(ref(db, `admins/${user.uid}`));
    isAdmin = adminSnap.val() === true;

    $("login").hidden = isAdmin;
    $("admin-tools").hidden = !isAdmin;

    if (isAdmin) renderAdminEvents();

  } catch (error) {
    isAdmin = false;
    $("login").hidden = false;
    $("admin-tools").hidden = true;
    console.error("Adminstatus konnte nicht geprüft werden:", error);
  }

  authReady = true;
  render();
});

onValue(ref(db, "events"), snapshot => {
  events = snapshot.val() || {};
  render();

  if (isAdmin) renderAdminEvents();

}, error => {
  say("status", `Events konnten nicht geladen werden: ${error.code || error.message}`);
  console.error("Events laden fehlgeschlagen:", error);
});

onValue(ref(db, "signups"), snapshot => {
  signups = snapshot.val() || {};
  render();
}, error => {
  console.error("Anmeldungen laden fehlgeschlagen:", error);
});

if (!auth.currentUser) {
  signInAnonymously(auth).catch(error => {
    say("status", `Firebase-Anmeldung fehlgeschlagen: ${error.code || error.message}`);
    console.error("Anonyme Anmeldung fehlgeschlagen:", error);
  });
}
</script>
</body>
</html>
