
<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>golf together</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6ef;
      color: #203d32;
    }
    header {
      background: #173f35;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin-bottom: 0;
      color: #d9ed9b;
    }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 0 16px;
    }
    .event {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #00000010;
    }
    .event h2 {
      margin-top: 0;
    }
    .date {
      color: #6a806d;
      font-size: 14px;
    }
    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
    }
    .person {
      background: #e7efdc;
      padding: 10px 13px;
      border-radius: 8px;
      font-weight: bold;
    }
    label {
      display: block;
      margin: 12px 0 5px;
      font-size: 14px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5ca;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #173f35;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #285b49;
    }
    #message {
      font-size: 14px;
      line-height: 1.5;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #6a806d;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>golf together</h1>
    <p>Gemeinsam auf dem Green</p>
  </header>

  <main>
    <article class="event">
      <p class="date">EVENT · 24. APRIL 2027</p>
      <h2>Golfclub Waldkirch</h2>
      <p>Ein gemeinsamer Golftag in schöner Ostschweizer Landschaft.</p>

      <hr>
      <p><strong>Wer ist dabei?</strong></p>
      <div id="people" class="people">
        <span>Noch keine Anmeldungen</span>
      </div>

      <form id="signup">
        <label for="firstName">Vorname</label>
        <input id="firstName" maxlength="50" required>

        <label for="lastName">Nachname</label>
        <input id="lastName" maxlength="50" required>

        <button type="submit">Für Waldkirch anmelden</button>
      </form>
      <p id="message" role="status"></p>
    </article>
  </main>

  <footer>golf together · Schön, dass du dabei bist.</footer>

  <script>
    const STORAGE_KEY = "golf-together-waldkirch";
    const form = document.getElementById("signup");
    const people = document.getElementById("people");
    const message = document.getElementById("message");

    let attendees = [];

    try {
      attendees = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(attendees)) attendees = [];
    } catch {
      attendees = [];
    }

    function render() {
      people.replaceChildren();

      if (attendees.length === 0) {
        people.textContent = "Noch keine Anmeldungen";
        return;
      }

      attendees.forEach((person) => {
        const chip = document.createElement("span");
        chip.className = "person";
        chip.textContent = person.initials;
        people.appendChild(chip);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const first = document.getElementById("firstName").value.trim();
      const last = document.getElementById("lastName").value.trim();

      if (!first || !last) return;

      const duplicate = attendees.some(
        (p) => p.first.toLocaleLowerCase("de-CH") === first.toLocaleLowerCase("de-CH")
          && p.last.toLocaleLowerCase("de-CH") === last.toLocaleLowerCase("de-CH")
      );

      if (duplicate) {
        message.textContent = "Du bist bereits angemeldet.";
        return;
      }

      const initials = Array.from(first)[0].toLocaleUpperCase("de-CH")
        + Array.from(last)[0].toLocaleUpperCase("de-CH");

      attendees.push({ first, last, initials });

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(attendees));
      } catch {
        message.textContent = "Speichern im Browser ist nicht möglich.";
        return;
      }

      render();
      form.reset();
      message.textContent = "Deine Anmeldung wurde gespeichert.";
    });

    render();
  </script>
</body>
</html>
